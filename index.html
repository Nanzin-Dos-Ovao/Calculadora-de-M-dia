<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculadora">
        <h1>Calculadora de Média</h1>

        <input type="number" id="nota1" placeholder="Digite a 1ª nota">
        <input type="number" id="nota2" placeholder="Digite a 2ª nota">
        <input type="number" id="nota3" placeholder="Digite a 3ª nota">

        <button onclick="calcularMedia()">
            Calcular Média
        </button>

        <p id="resultado"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
